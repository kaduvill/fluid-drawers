plugins {
    id 'java-library'
    id 'eclipse'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

group = 'xyz.phanta.fluiddrawers'
version = '1.0.7'

base {
    archivesName.set('fluiddrawers-1.12.2')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.release.set(8)

    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(17))
        vendor.set(JvmVendorSpec.AZUL)
    })
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
        vendor.set(JvmVendorSpec.AZUL)
    }
}

minecraft {
    mcVersion.set('1.12.2')

    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')

    useDependencyAccessTransformers.set(true)

    username.set('Developer')
    extraRunJvmArguments.add("-ea:${project.group}")
}

repositories {
    mavenCentral()

    maven {
        name = 'Curse Maven'
        url = uri('https://cursemaven.com')
    }
}

dependencies {
    implementation rfg.deobf('curse.maven:libnine-322344:3073839') // 1.2.0

    implementation rfg.deobf('curse.maven:chameleon-230497:2450900') // 4.1.3
    implementation rfg.deobf('curse.maven:storage-drawers-223852:2952606') // 5.4.2
    implementation rfg.deobf('curse.maven:framed-compacting-drawers-376351:3015136') // 1.2.7
}

for (runTask in ['runClient', 'runServer']) {
    tasks.named(runTask).configure {
        extraJvmArgs.add(
                '-Dfml.coreMods.load=xyz.phanta.fluiddrawers.coremod.FluidDrawersCoreMod'
        )
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'FMLCorePluginContainsFMLMod': 'true',
                'FMLCorePlugin': 'xyz.phanta.fluiddrawers.coremod.FluidDrawersCoreMod'
        )
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft.mcVersion.get()

    filesMatching('mcmod.info') {
        expand(
                'version': project.version,
                'mcversion': minecraft.mcVersion.get()
        )
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
        inheritOutputDirs = true
    }
}